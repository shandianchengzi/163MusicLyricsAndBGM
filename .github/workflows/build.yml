name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: v7.3.0-bgm.1
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: dotnet test cross-platform/MusicLyricApp.sln --configuration Release
      - run: dotnet publish cross-platform/MusicLyricApp/MusicLyricApp.csproj -c Release -r win-x64 --self-contained true -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: MusicLyricsAndBGM-win-x64
          path: publish/
  release:
    needs: test
    if: github.ref == 'refs/heads/master' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')))
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || 'v7.3.0-bgm.1' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: MusicLyricsAndBGM-win-x64
          path: publish
      - name: Package Windows application
        shell: pwsh
        run: |
          Compress-Archive -Path publish/* -DestinationPath MusicLyricsAndBGM-win-x64.zip
          $hash = (Get-FileHash MusicLyricsAndBGM-win-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  MusicLyricsAndBGM-win-x64.zip" | Set-Content SHA256SUMS.txt -Encoding ascii
      - name: Publish release
        shell: pwsh
        env:
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          @'
          新增伴奏提取功能：
          - 下载当前搜索歌曲后分离伴奏（需平台提供可用直链）。
          - 导入本地 MP3、WAV、FLAC 后提取伴奏。
          - 使用 vocal-separate 的 2stems 模型，保存 WAV 伴奏，支持取消。
          
          使用方法：
          1. 下载 MusicLyricsAndBGM-win-x64.zip，完整解压后运行 MusicLyricApp.exe，无需另装 .NET。
          2. 先安装并启动 https://github.com/jianchang512/vocal-separate 的 start.exe，确认 2stems 模型可用。
          3. 在本程序菜单打开“伴奏提取”，默认连接 http://127.0.0.1:9999。
          
          本压缩包不包含 vocal-separate、Python 环境或分离模型，需要单独安装。
          歌曲下载受平台权限及直链有效期限制；失败时请导入本地音频。
          构建与 60 项自动测试通过；尚未实际运行模型验证分离音质。
          '@ | Set-Content release-notes.md -Encoding utf8
          gh release create "$env:RELEASE_TAG" MusicLyricsAndBGM-win-x64.zip SHA256SUMS.txt --target "$env:RELEASE_COMMIT" --title "歌词与伴奏提取 v7.3.0-bgm.1" --notes-file release-notes.md --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
