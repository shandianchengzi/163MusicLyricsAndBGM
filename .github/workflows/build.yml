name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: v7.3.0-bgm.2
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: dotnet test cross-platform/MusicLyricApp.sln --configuration Release
      - run: dotnet publish cross-platform/MusicLyricApp/MusicLyricApp.csproj -c Release -r win-x64 --self-contained true -o publish
      - uses: actions/cache@v4
        with:
          path: .engine-cache/vocal-separate-v0.0.4.7z
          key: vocal-separate-v0.0.4-2cbf46a0555183353292a7ddfd3d300b0cb845bc252a9505b0786fc201ca59f4
      - name: Bundle pinned vocal-separate runtime and 2stems model
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .engine-cache | Out-Null
          $archive = '.engine-cache/vocal-separate-v0.0.4.7z'
          if (!(Test-Path $archive)) {
            curl.exe --fail --location --retry 3 https://github.com/jianchang512/vocal-separate/releases/download/v0.0.4/vocal-separate-v0.0.4.7z -o $archive
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLower() -ne '2cbf46a0555183353292a7ddfd3d300b0cb845bc252a9505b0786fc201ca59f4') { throw 'Upstream engine checksum mismatch' }
          & "$env:ProgramFiles/7-Zip/7z.exe" x $archive -o.engine-upstream -y | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/vocal-engine/package_engine.py .engine-upstream publish/engine
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Real-model MP3 and cancellation integration tests
        shell: pwsh
        run: |
          $env:BGM_TEST_ENGINE = (Resolve-Path publish/engine).Path
          $env:CUDA_VISIBLE_DEVICES = '-1'
          dotnet test cross-platform/MusicLyricApp.Tests/MusicLyricApp.Tests.csproj -c Release --no-build --filter FullyQualifiedName~EmbeddedSeparationServiceTest --logger 'console;verbosity=normal'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package complete Windows application and upstream source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Push-Location publish
          & "$env:ProgramFiles/7-Zip/7z.exe" a -tzip -mx=5 ../release-assets/MusicLyricsAndBGM-win-x64.zip ./* | Out-Null
          $archiveExit = $LASTEXITCODE
          Pop-Location
          if ($archiveExit -ne 0) { exit $archiveExit }
          curl.exe --fail --location --retry 3 https://github.com/jianchang512/vocal-separate/archive/5d11a4cff3b6eafcb41f92a0772301c0e1fe1465.zip -o release-assets/vocal-separate-v0.0.4-source.zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem release-assets/*.zip | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content release-assets/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: MusicLyricsAndBGM-win-x64
          path: release-assets/
          compression-level: 0
  release:
    needs: test
    if: github.ref == 'refs/heads/master' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')))
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || 'v7.3.0-bgm.2' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: MusicLyricsAndBGM-win-x64
          path: release-assets
      - name: Publish release
        shell: pwsh
        env:
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          gh release create "$env:RELEASE_TAG" release-assets/MusicLyricsAndBGM-win-x64.zip release-assets/vocal-separate-v0.0.4-source.zip release-assets/SHA256SUMS.txt --target "$env:RELEASE_COMMIT" --title "歌词与伴奏提取 $env:RELEASE_TAG（内置引擎）" --notes-file docs/release-notes.md --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
